    let lang="th";
    try{const s=localStorage.getItem("applied_sim_lang");if(s==="en"||s==="th")lang=s;}catch(e){}
    const state={mode:"transport",subMode:"xylem",sunlight:75,moisture:65};
    const container=document.getElementById("threeContainer"),scene=new THREE.Scene();
    const camera=new THREE.PerspectiveCamera(48,1,0.1,1000),renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));renderer.setClearColor(0x040d0a,1);container.appendChild(renderer.domElement);
    scene.add(new THREE.AmbientLight(0xdcfce7,0.8));const sunLight=new THREE.DirectionalLight(0xfef08a,1.4);sunLight.position.set(25,45,30);scene.add(sunLight);
    const plantGroup=new THREE.Group();scene.add(plantGroup);

    const cam={r:34,tr:34,th:0.3,ph:1.3,tth:0.3,tph:1.3};
    function resetCam(){cam.tr=34;cam.tth=0.3;cam.tph=1.3;}
    let drag=false,prev={x:0,y:0};
    renderer.domElement.addEventListener("pointerdown",e=>{drag=true;prev={x:e.clientX,y:e.clientY};});
    window.addEventListener("pointermove",e=>{if(!drag)return;cam.tth-=(e.clientX-prev.x)*0.0075;cam.tph=Math.max(0.2,Math.min(Math.PI-0.2,cam.tph-(e.clientY-prev.y)*0.0075));prev={x:e.clientX,y:e.clientY};});
    window.addEventListener("pointerup",()=>drag=false);
    renderer.domElement.addEventListener("wheel",e=>{e.preventDefault();cam.tr=Math.max(8,Math.min(75,cam.tr+e.deltaY*0.03));},{passive:false});
    function resize(){const w=container.clientWidth||800,h=container.clientHeight||480;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);}
    window.addEventListener("resize",resize);

    let waterPts=[],sugarPts=[],lip1=null,lip2=null,chemPts=[];
    function buildScene(){
      while(plantGroup.children.length)plantGroup.remove(plantGroup.children[0]);
      waterPts=[];sugarPts=[];chemPts=[];lip1=null;lip2=null;
      const wood=new THREE.MeshStandardMaterial({color:0x5b3a29}),leaf=new THREE.MeshStandardMaterial({color:0x15803d,side:THREE.DoubleSide});
      if(state.mode==="transport"){
        if(state.subMode==="stoma"){
          const fl=new THREE.Mesh(new THREE.PlaneGeometry(14,14),leaf);fl.rotation.x=Math.PI/2;plantGroup.add(fl);
          const gm=new THREE.MeshStandardMaterial({color:0x4ade80});
          lip1=new THREE.Mesh(new THREE.TorusGeometry(2.4,0.7,14,28,Math.PI),gm);lip1.rotation.set(Math.PI/2,0,Math.PI/2);lip1.position.x=-0.6;
          lip2=new THREE.Mesh(new THREE.TorusGeometry(2.4,0.7,14,28,Math.PI),gm);lip2.rotation.set(Math.PI/2,0,-Math.PI/2);lip2.position.x=0.6;
          plantGroup.add(lip1,lip2);
        }else{
          plantGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(4,4.2,16,24,1,true,0,Math.PI*1.5),wood));
          for(let i=0;i<6;i++){const a=i/6*Math.PI*1.4+0.2,x=Math.cos(a)*2.2,z=Math.sin(a)*2.2;plantGroup.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,16.5,12),new THREE.MeshStandardMaterial({color:0x0284c7,transparent:true,opacity:0.45})),{position:new THREE.Vector3(x,0,z)}));for(let k=0;k<3;k++){const w=new THREE.Mesh(new THREE.SphereGeometry(0.24,10,10),new THREE.MeshBasicMaterial({color:0x38bdf8}));w.position.set(x,-7+k*5,z);plantGroup.add(w);waterPts.push(w);}}
          for(let i=0;i<6;i++){const a=i/6*Math.PI*1.4+0.4,x=Math.cos(a)*3.3,z=Math.sin(a)*3.3;for(let k=0;k<3;k++){const s=new THREE.Mesh(new THREE.SphereGeometry(0.22,10,10),new THREE.MeshBasicMaterial({color:0xfbbf24}));s.position.set(x,7-k*5,z);plantGroup.add(s);sugarPts.push(s);}}
        }
      }else if(state.mode==="photosynth"){
        plantGroup.add(new THREE.Mesh(new THREE.BoxGeometry(12,0.8,12),leaf));
        for(let i=0;i<9;i++){const c=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,0.5,16),new THREE.MeshStandardMaterial({color:0x22c55e}));c.position.set(((i%3)-1)*3.4,0.5,(Math.floor(i/3)-1)*3.4);plantGroup.add(c);}
      }else if(state.mode==="ecology"){
        plantGroup.add(new THREE.Mesh(new THREE.SphereGeometry(1.2,18,18),new THREE.MeshStandardMaterial({color:0xf59e0b})));
        for(let i=0;i<8;i++){const a=i/8*Math.PI*2,p=new THREE.Mesh(new THREE.CylinderGeometry(0.7,1.2,3,12),new THREE.MeshStandardMaterial({color:state.subMode==="defense"?0x10b981:0xf43f5e}));p.position.set(Math.cos(a)*2.2,0,Math.sin(a)*2.2);p.rotation.z=Math.PI/2;p.rotation.y=-a;plantGroup.add(p);}
        for(let v=0;v<20;v++){const m=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,8),new THREE.MeshBasicMaterial({color:0xf472b6}));m.position.set((Math.random()-0.5)*10,(Math.random()-0.5)*4,(Math.random()-0.5)*10);plantGroup.add(m);chemPts.push({m,sp:0.04});}
      }else if(state.mode==="evolution"){
        if(state.subMode==="bryo"){plantGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(6,6,1,24),new THREE.MeshStandardMaterial({color:0x14532d})));for(let i=0;i<30;i++){const c=new THREE.Mesh(new THREE.ConeGeometry(0.3,1.2,8),new THREE.MeshStandardMaterial({color:0x4ade80}));c.position.set((Math.random()-0.5)*9,0.8,(Math.random()-0.5)*9);plantGroup.add(c);}}
        else{const t=new THREE.Mesh(new THREE.CylinderGeometry(1,1.4,11,14),wood);t.position.y=5;plantGroup.add(t);const cn=new THREE.Mesh(state.subMode==="gymno"?new THREE.ConeGeometry(4.5,7,18):new THREE.SphereGeometry(4.5,20,20),leaf);cn.position.y=11;plantGroup.add(cn);}
      }else{
        if(state.subMode==="paper"){for(let s=0;s<4;s++){const sh=new THREE.Mesh(new THREE.BoxGeometry(8,0.18,10),new THREE.MeshStandardMaterial({color:0xf8fafc}));sh.position.y=s*0.5;plantGroup.add(sh);}}
        else if(state.subMode==="dyes"){[0x1e40af,0xfacc15,0xbe123c].forEach((c,i)=>{const r=new THREE.Mesh(new THREE.BoxGeometry(1.8,7,0.12),new THREE.MeshStandardMaterial({color:c}));r.position.set((i-1)*2.4,4,0);plantGroup.add(r);});}
        else{const fl=new THREE.Mesh(new THREE.CylinderGeometry(1.5,3,6,20),new THREE.MeshStandardMaterial({color:0x38bdf8,transparent:true,opacity:0.45}));fl.position.y=3;plantGroup.add(fl);const lq=new THREE.Mesh(new THREE.CylinderGeometry(1.4,2.8,3.2,20),new THREE.MeshStandardMaterial({color:state.subMode==="scents"?0xf59e0b:0x10b981}));lq.position.y=1.8;plantGroup.add(lq);}
      }
    }

    function renderSubPanels(){
      const en=lang==="en";
      [["transport","panelTransport"],["photosynth","panelPhotosynth"],["ecology","panelEcology"],["evolution","panelEvolution"],["materials","panelMaterials"]].forEach(([mk,pid])=>{
        const p=document.getElementById(pid);p.innerHTML="";
        Object.entries(MODS[mk]).forEach(([sk,obj])=>{
          const act=state.mode===mk&&state.subMode===sk;
          const b=document.createElement("button");
          b.className=`p-2 rounded-xl border text-left transition ${act?"border-emerald-400 bg-emerald-950/40":"border-slate-800 bg-slate-900/60 hover:bg-slate-800"}`;
          b.innerHTML=`<div class="text-xs font-bold text-white">${en?obj.btn_en:obj.btn_th}</div><div class="text-[10px] text-slate-400">${en?obj.s_en:obj.s_th}</div>`;
          b.addEventListener("click",()=>setMode(mk,sk));
          p.appendChild(b);
        });
      });
    }

    function setMode(m,s){
      state.mode=m;state.subMode=s||(m==="transport"?"xylem":m==="photosynth"?"C3":m==="ecology"?"pollinator":m==="evolution"?"angio":"paper");
      const en=lang==="en";
      document.documentElement.lang=lang;
      document.getElementById("btnLangToggle").textContent=en?"🌐 EN → TH":"🌐 TH → EN";
      document.getElementById("hdrSub").textContent=en?"Vascular Transport • C3/C4/CAM • VOCs • 500M-Yr Evolution • Paper/Dyes/Scents/Medicine":"ท่อลำเลียง • สังเคราะห์แสง C3/C4/CAM • สารสื่อสาร VOCs • วิวัฒนาการ 500 ล้านปี • กระดาษ สี กลิ่น ยา";
      document.getElementById("btnResetCamera").textContent=en?"🎯 Reset Camera":"🎯 รีเซ็ตกล้อง";
      document.getElementById("lblSun").textContent=en?"☀️ Sun:":"☀️ แสง:";
      document.getElementById("lblMoist").textContent=en?"🌧️ Moisture:":"🌧️ ความชื้น:";
      document.getElementById("hudTips").textContent=en?"🖱️ Drag to Orbit 360° • 🔍 Scroll to Zoom":"🖱️ ลากหมุน 360° • 🔍 ซูม";
      document.getElementById("civBadge").textContent=en?"Industry, Food & Medical Applications":"การประยุกต์ใช้อุตสาหกรรม & อาหาร/ยา";

      const tabLabels={Transport:en?"💧 Transport":"💧 ลำเลียงน้ำ-อาหาร",Photosynth:en?"☀️ Photosynthesis":"☀️ สังเคราะห์แสง",Ecology:en?"🐝 Ecology VOCs":"🐝 สารสื่อสาร VOCs",Evolution:en?"⏳ Evolution":"⏳ วิวัฒนาการ",Materials:en?"📜 Bio-Materials":"📜 กระดาษ/สี/กลิ่น/ยา"};
      ["Transport","Photosynth","Ecology","Evolution","Materials"].forEach(k=>{const b=document.getElementById("tabBtn"+k),p=document.getElementById("panel"+k),act=k.toLowerCase()===m;if(b){b.textContent=tabLabels[k];b.className=act?"px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 text-slate-950":"px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:bg-slate-800";}if(p)p.classList.toggle("hidden",!act);});
      renderSubPanels();

      const mod=MODS[state.mode][state.subMode];
      document.getElementById("hudIconBadge").textContent=mod.icon;document.getElementById("hudTitle").textContent=en?mod.title_en:mod.title_th;document.getElementById("hudSubtitle").textContent=mod.sub;
      document.getElementById("inspectorBadgeBox").textContent=mod.icon;document.getElementById("inspectorHeading").textContent=en?mod.title_en:mod.title_th;document.getElementById("inspectorSubHeading").textContent=mod.sub;
      document.getElementById("param1Label").textContent=en?mod.p1L_en:mod.p1L_th;document.getElementById("param1Value").textContent=mod.p1V;
      document.getElementById("param2Label").textContent=en?mod.p2L_en:mod.p2L_th;document.getElementById("param2Value").textContent=mod.p2V;
      document.getElementById("inspectorDescription").textContent=en?mod.desc_en:mod.desc_th;
      document.getElementById("inspectorBullets").innerHTML=(en?mod.b_en:mod.b_th).map(b=>`<li>${b}</li>`).join("");
      document.getElementById("civTitle").textContent=en?mod.civT_en:mod.civT_th;document.getElementById("civDescription").textContent=en?mod.civD_en:mod.civD_th;
      document.getElementById("hudDynamicNote").textContent=(en?"Active: ":"กำลังแสดง: ")+(en?mod.title_en:mod.title_th);
      buildScene();
    }

    document.getElementById("btnBackHub").addEventListener("click",()=>{window.location.href="index.html";});
    document.getElementById("btnLangToggle").addEventListener("click",()=>{lang=lang==="th"?"en":"th";try{localStorage.setItem("applied_sim_lang",lang);}catch(e){}setMode(state.mode,state.subMode);});
    document.getElementById("tabBtnTransport").addEventListener("click",()=>setMode("transport"));
    document.getElementById("tabBtnPhotosynth").addEventListener("click",()=>setMode("photosynth"));
    document.getElementById("tabBtnEcology").addEventListener("click",()=>setMode("ecology"));
    document.getElementById("tabBtnEvolution").addEventListener("click",()=>setMode("evolution"));
    document.getElementById("tabBtnMaterials").addEventListener("click",()=>setMode("materials"));
    document.getElementById("btnResetCamera").addEventListener("click",resetCam);
    document.getElementById("sunlightSlider").addEventListener("input",e=>{state.sunlight=Number(e.target.value);sunLight.intensity=(state.sunlight/100)*1.8;if(lip1&&lip2){const g=0.3+(state.sunlight/100)*0.9;lip1.position.x=-g;lip2.position.x=g;}});
    document.getElementById("moistureSlider").addEventListener("input",e=>state.moisture=Number(e.target.value));

    let clk=new THREE.Clock();
    function animate(){requestAnimationFrame(animate);const el=clk.getElapsedTime();
      cam.r+=(cam.tr-cam.r)*0.08;cam.th+=(cam.tth-cam.th)*0.08;cam.ph+=(cam.tph-cam.ph)*0.08;
      camera.position.set(cam.r*Math.sin(cam.ph)*Math.sin(cam.th),cam.r*Math.cos(cam.ph),cam.r*Math.sin(cam.ph)*Math.cos(cam.th));camera.lookAt(0,3,0);
      waterPts.forEach(w=>{w.position.y+=0.08*(state.sunlight/70);if(w.position.y>8)w.position.y=-8;});
      sugarPts.forEach(s=>{s.position.y-=0.06;if(s.position.y<-8)s.position.y=8;});
      chemPts.forEach(c=>{c.m.position.y+=c.sp;if(c.m.position.y>6)c.m.position.y=-2;});
      plantGroup.rotation.y=el*0.05;renderer.render(scene,camera);
    }
    window.addEventListener("load",()=>{resize();setMode("transport","xylem");animate();});
  </script>
</body>
</html>
